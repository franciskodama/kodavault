name: DB Cloud Backup

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC every day
  workflow_dispatch: # Manual trigger

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backup
        env:
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          BACKUP_SECRET: "${{ secrets.BACKUP_SECRET }}"
          GCS_PROJECT_ID: "${{ secrets.GCS_PROJECT_ID }}"
          GCS_CLIENT_EMAIL: "${{ secrets.GCS_CLIENT_EMAIL }}"
          GCS_PRIVATE_KEY: "${{ secrets.GCS_PRIVATE_KEY }}"
          GCS_BUCKET_NAME: "${{ secrets.GCS_BUCKET_NAME }}"
        run: yarn db:backup
