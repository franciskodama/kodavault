name: DB Cloud Backup

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC every day
  workflow_dispatch: # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_SECRET: ${{ secrets.BACKUP_SECRET }}
      GCS_PROJECT_ID: ${{ secrets.GCS_PROJECT_ID }}
      GCS_CLIENT_EMAIL: ${{ secrets.GCS_CLIENT_EMAIL }}
      GCS_PRIVATE_KEY: ${{ secrets.GCS_PRIVATE_KEY }}
      GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Backup
        run: yarn db:backup
